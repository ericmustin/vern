name: release-image

on:
  push:
    tags:
      - "v*"
  # Dry run: builds both images without pushing.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

  image:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: test
    env:
      # Only tag pushes publish; workflow_dispatch is a build-only dry run
      # (on any ref, including a tag) with a placeholder image tag, since a
      # branch name may not be a valid image tag.
      PUSH: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
      IMAGE_TAG: ${{ github.event_name == 'push' && github.ref_name || format('dryrun-{0}', github.run_id) }}
      # Pre-release tags (containing '-', e.g. v1.0.0-rc1) never move the
      # floating latest/ci tags.
      FLOATING: ${{ github.event_name == 'push' && github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          build-args: VERSION=${{ env.IMAGE_TAG }}
          provenance: false
          cache-from: type=gha,scope=vern-image
          cache-to: type=gha,mode=max,scope=vern-image
          tags: |
            ghcr.io/ericmustin/vern:${{ env.IMAGE_TAG }}
            ${{ env.FLOATING == 'true' && 'ghcr.io/ericmustin/vern:latest' || '' }}

      - name: Build and push CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ci
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          build-args: VERSION=${{ env.IMAGE_TAG }}
          provenance: false
          cache-from: type=gha,scope=vern-image
          cache-to: type=gha,mode=max,scope=vern-image
          tags: |
            ghcr.io/ericmustin/vern:${{ env.IMAGE_TAG }}-ci
            ${{ env.FLOATING == 'true' && 'ghcr.io/ericmustin/vern:ci' || '' }}
