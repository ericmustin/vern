# vern.yaml — Default configuration for Vern CLI
# This file is loaded by default from the current directory.
# Override with --config flag.

# Which backend to target for query generation
backend: esql

# Path to vendored upstream spec rule markdown files
rules_dir: ./spec/rules

# Path to backend-specific query mappings
mappings: ./configs/esql-mappings.yaml

# Output format for workflow generation
format: elastic

# Backend-specific configuration
esql:
  # Lookback window for rule evaluation queries.
  # 1h is the spec's typical window for live monitoring; bump to a longer
  # window (e.g. 7d, 30d) when demoing against stale data.
  time_window: "30d"

  # Lookback window used by the final score aggregation over Vern's result index.
  # Keep this longer than the workflow's expected runtime and schedule interval.
  score_lookback: "2h"

  # Prefix ES|QL rule queries with `SET unmapped_fields="nullify";` so rules
  # that reference fields absent from the data return null instead of failing
  # with "Unknown column". Requires ES 9.5+. Set to "off" to disable.
  unmapped_fields: "nullify"

  # Elasticsearch index patterns for OTel data.
  # Defaults match Elastic Serverless OTLP ingestion (data streams created
  # automatically when sending via the project's OTLP endpoint). If you ingest
  # via the legacy APM agent, use "traces-apm*" instead.
  index_patterns:
    traces: "traces-*.otel-*"
    metrics: "metrics-*.otel-*"
    logs: "logs-*.otel-*"

  # Where to store rule evaluation results
  result_index: "instrumentation-score-results"

  # Where to write APM annotation documents
  annotations_index: "observability-annotations"

  # Schedule interval for the generated workflow (default: hourly)
  # Uses Elastic Workflows interval format: "5m", "15m", "30m", "1h", "6h", "12h", "1d"
  schedule: "1h"

  # Cardinality threshold for MET-001 rule
  cardinality_threshold: 10000

# Optional rule-evaluation scope filters. Empty arrays = evaluate over all data.
# Scoping to prod-like environments tends to produce more actionable findings.
filters:
  # Restrict evaluation to these deployment environments (matched case-insensitively
  # against resource.attributes.deployment.environment.name).
  environments: []
  #   - "prod"
  #   - "production"

  # Restrict evaluation to these service namespaces.
  service_namespaces: []

  # SDK-001 (SDK/runtime support window) is opt-in because it depends on a
  # vendored support matrix that drifts over time. Set true to score it.
  enable_sdk_rules: false

# Upstream spec source. `vern spec sync` fetches at this pinned ref and diffs
# against ./spec/. Pin to a tag or commit SHA — never `main` in production —
# so builds remain reproducible.
spec:
  upstream_repo: "instrumentation-score/spec"
  upstream_ref: "ef080a8a42d2fe73a4f0ed8d64eda93bfe84adc7"

# Upstream semantic-conventions source. `vern semconv sync` regenerates
# internal/semconv/attribute_keys.go and placement.go from the pinned ref.
semconv:
  upstream_repo: "open-telemetry/semantic-conventions"
  upstream_ref: "v1.37.0"

# Elastic connection.
# `vern sync` uses kibana_url; `vern evaluate --backend elastic` uses
# elasticsearch_url. Both share api_key. Can also be set via environment
# variables: VERN_API_KEY, VERN_KIBANA_URL, VERN_ELASTICSEARCH_URL.
elastic:
  # kibana_url: "https://<your-project>.kb.elastic.cloud"
  # elasticsearch_url: "https://<your-project>.es.elastic.cloud"
  # api_key: ""  # Prefer VERN_API_KEY env var

# OpenSearch connection (used by `vern evaluate --backend opensearch`).
# Env-var fallbacks: VERN_OPENSEARCH_URL, VERN_OPENSEARCH_USERNAME,
# VERN_OPENSEARCH_PASSWORD.
# opensearch:
#   url: "https://opensearch.example.com:9200"
#   username: "admin"
#   password: ""  # Prefer VERN_OPENSEARCH_PASSWORD
#   # OpenSearch PPL uses INTERVAL units, e.g. "30 DAY", "1 HOUR".
#   time_window: "30 DAY"
#   # Defaults follow SS4O naming written by the OTel Collector's opensearch
#   # exporter. For Data Prepper pipelines use e.g. traces: "otel-v1-apm-span-*".
#   index_patterns:
#     traces: "ss4o_traces-*-*"
#     metrics: "ss4o_metrics-*-*"
#     logs: "ss4o_logs-*-*"

# ClickHouse connection (used by `vern evaluate --backend clickhouse`).
# Env-var fallbacks: VERN_CLICKHOUSE_URL, VERN_CLICKHOUSE_USERNAME,
# VERN_CLICKHOUSE_PASSWORD.
# clickhouse:
#   url: "http://localhost:8123"
#   username: "default"
#   password: ""  # Prefer VERN_CLICKHOUSE_PASSWORD
#   database: "otel"
#   # ClickHouse uses INTERVAL units, not relative time strings: "30 DAY", "6 HOUR", etc.
#   time_window: "30 DAY"
#   tables:
#     traces: "otel_traces"
#     logs: "otel_logs"
#     metrics: "otel_metrics_sum"

# Services to exclude from evaluation
# Useful for ignoring internal/system services
exclusions:
  services: []
  # - "otel-collector"
  # - "elastic-agent"
  service_patterns: []
  # - "^test-.*"
  # - "^debug-.*"
